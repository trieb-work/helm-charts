  # Global image configuration
  image:
    repository: ghcr.io/saleor/saleor
    tag: "3.21.8"
    pullPolicy: IfNotPresent

  # Database configuration (using built-in PostgreSQL)
  database:
    maxConnections: 100
    connectionTimeout: 5
    connMaxAge: 0

  # TLS disabled for staging (HTTP only)
  tls:
    enabled: false

# API Server Configuration
api:
  enabled: true
  replicaCount: 1

  # Environment variables
  extraEnv:
    # Allow all hosts for staging (configure specific domains for production)
    - name: ALLOWED_HOSTS
      value: "saleor.staging-vapaus.com,localhost,127.0.0.1"
    # CORS configuration - add your Cloud Run domain here if needed
    - name: ALLOWED_CLIENT_HOSTS
      value: "saleor.staging-vapaus.com"
    # Disable debug mode for staging
    - name: DEBUG
      value: "False"

  service:
    type: ClusterIP
    port: 8000

  # Resource allocation for staging
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Autoscaling disabled for staging (enable for production)
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Dashboard Configuration
dashboard:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/saleor/saleor-dashboard
    tag: "3.21.3"
    pullPolicy: IfNotPresent

  # Apps marketplace URLs
  appsMarketplaceApiUrl: "https://apps.saleor.io/api/v2/saleor-apps"
  appsExtensionsApiUrl: "https://apps.saleor.io/api/v2/saleor-apps"
  isCloudInstance: false

  extraEnv: []

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false

# Celery Worker Configuration
worker:
  enabled: true
  replicaCount: 1

  extraEnv: []

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: false

  # Celery Beat Scheduler resources
  scheduler:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Database Migrations
migrations:
  enabled: true
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

# Storage Configuration
# Using persistent volumes for staging (no S3/GCS)
storage:
  s3:
    enabled: false
  gcs:
    enabled: false

# PostgreSQL Configuration (Built-in)
postgresql:
  enabled: true
  architecture: standalone

  # Override image repository to use Bitnami legacy catalog
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r9"

  auth:
    database: saleor
    username: saleor
    # Use manually created secret to avoid encoding issues
    existingSecret: saleor-postgresql
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: user-password
      replicationPasswordKey: replication-password

  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""  # Uses default GKE storage class

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

    # PostgreSQL tuning for staging
    extendedConfiguration: |
      work_mem = 32MB
      maintenance_work_mem = 128MB
      shared_buffers = 256MB
      temp_buffers = 8MB
      max_connections = 100

# Redis Configuration (Built-in)
redis:
  enabled: true
  architecture: standalone

  # Override image repository to use Bitnami legacy catalog
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: "7.4.1-debian-12-r3"

  auth:
    enabled: true
    # Use manually created secret to avoid encoding issues
    existingSecret: saleor-redis
    existingSecretPasswordKey: redis-password

  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""  # Uses default GKE storage class

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"

  # Common annotations for nginx ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

  # API Ingress
  api:
    enabled: true
    annotations: {}
    hosts:
      - host: saleor.staging-vapaus.com
        paths:
          - path: /graphql/
            pathType: Prefix
          - path: /thumbnail/
            pathType: Prefix
          - path: /.well-known/jwks.json
            pathType: ImplementationSpecific
    # TLS disabled for staging
    tls: []

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Security Context
podSecurityContext: {}

securityContext: {}

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Common labels and annotations
commonLabels: {}
commonAnnotations: {}

